# Re-opens the shared Product type (declared in silvershop-suite/api-graphql's _graphql/types.yml) to add the
# `downloadable` flag. Field name mirrors SilverShop\Api\Enrichment\DownloadProductEnrichment ($data['downloadable'])
# key-for-key, so GraphQL's default array field-resolver maps the REST serializer's output with no PHP.
# silverstripe/graphql merges the field into the single Product type (Type::mergeWith). The file list / grant status
# is purchase- and member-scoped and deferred to a later phase. Only read when the overlay is installed (see
# _config/graphql.yml guard).

# Adds Product.downloadable — rides SilverShop\Api\Enrichment\DownloadProductEnrichment
Product:
  fields:
    downloadable: Boolean
